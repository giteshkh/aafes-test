# >>> CUSTOMER: this file no longer holds credentials or the app url. <<<
# userName / accessKey / app come from environment variables: BROWSERSTACK_USERNAME,
# BROWSERSTACK_ACCESS_KEY, AppURL (put them in .env, see env.example).
# Also changed vs your original: idleTimeout (was browserstack.idleTimeout),
# proxyUnawareApp (false for Wikipedia; set true again for your AAFES app) and the
# accessibility block at the bottom (the SDK only reads accessibility from THIS file).
userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}
framework: pytest
app: ${AppURL}
platforms:
   - platformName: ${PlatformType}
     deviceName: ${DeviceName}
     platformVersion: ${DeviceVersion}

#  - platformName: iOS
#    deviceName: iPhone 15
#    platformVersion: 17.0
#  - platformName: android
#    deviceName: Samsung Galaxy S24 Ultra
#    platformVersion: 14.0
#  - platformName: android
#    deviceName: Samsung Galaxy S21 Ultra
#    platformVersion: 11.0
#  - platformName: android
#    deviceName: Google Pixel 6 Pro
#    platformVersion: 12.0
#  - platformName: android
#    deviceName: Google Pixel 4 XL
#    platformVersion: 10.0
#  - platformName: android
#    deviceName: OnePlus 9
#    platformVersion: 11.0
#  - platformName: android
#    deviceName: OnePlus 8
#    platformVersion: 10.0
browserstackLocal: false
#buildName: AAFES-MEA-Android-${BUILD_NUMBER}
sessionName: ${SESSION_NAME}
buildName: ${BUILD_NAME}
projectName: AAFES-MEA
buildIdentifier: ${BUILD_NUMBER}
debug: true
networkLogs: false
appProfiling: true
disableAutoCaptureLogs: true
percy: false
percyCaptureMode: manual
interactiveDebugging: true
#browserstack.networkLogs: true
selfHeal: true
aiAuthoring: true
appium:newCommandTimeout: 400
idleTimeout: 400
# >>> CUSTOMER: false so the Wikipedia app runs; set back to true for your AAFES app if it needs it. <<<
proxyUnawareApp: false
accessibility: true
accessibilityOptions:
  wcagVersion: wcag21aaa
  screenReaderAutomation:
    autoReport: true
    linearNavigation: true
    linearNavigationTimeout: 300000
  includeIssueType:
    bestPractice: true
    needsReview: true
    experimentalRules: true
